name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (ruff, mypy, pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.17"
      - run: uv python install 3.12
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy app
      - run: uv run pytest

  frontend:
    name: Frontend (lint, typecheck, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && corepack prepare pnpm@11.3.0 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  deploy-backend:
    name: Deploy backend (ECR -> App Runner)
    # Only after both suites are green, and only for pushes to main. The IAM role's trust
    # policy already pins the branch, so a pull request physically cannot assume it; this
    # guard just avoids a confusing red job on PRs.
    needs: [backend, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # `id-token: write` lets the runner mint the OIDC JWT it trades for temporary AWS
      # credentials. No long-lived AWS keys exist in this repo.
      id-token: write
      contents: read
    env:
      AWS_REGION: ap-south-1
      ECR_REPOSITORY: ringside-backend
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::325899476773:role/GitHubActionsRingsideECRPush
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-ringside-${{ github.run_id }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/amd64
          push: true
          # Tagged with the commit SHA as well as `latest`, so a rollback is repointing the
          # service at an earlier tag rather than a rebuild.
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          # Reuse the previous image's layers so only the `COPY app` layer rebuilds.
          cache-from: type=registry,ref=${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
          cache-to: type=inline

      - name: Summary
        run: |
          echo "Pushed \`${{ github.sha }}\` and \`latest\` to ECR." >> $GITHUB_STEP_SUMMARY
          echo "App Runner auto-deploys on the new \`latest\`." >> $GITHUB_STEP_SUMMARY
